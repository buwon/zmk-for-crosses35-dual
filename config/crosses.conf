# Uncomment the following line to enable OLED Displays
# CONFIG_ZMK_DISPLAY=y

# report battery for both sides of the keyboard
CONFIG_BT_BAS=y

# needed for &mmv / &msc (mouse move / scroll) on the Mouse layer
CONFIG_ZMK_POINTING=y

# --- 재연결 문제 진단용 로깅 (원인 확인 후 이 블록 전체를 제거할 것) ---
# 양쪽 절반 모두에 적용됨. 우/좌 아무 쪽이나 USB로 물리면
# CDC ACM 시리얼 포트로 로그가 나옴 (115200 8N1).
#   - 우(central): 호스트 프로필 connect/disconnect + peripheral connect/disconnect(+reason)
#   - 좌(peripheral): split 링크 쪽 connect/disconnect
# 우측은 studio-rpc-usb-uart 스니펫과 CDC ACM을 공유하므로, 로그는 두 번째
# 시리얼 포트로 잡힘.
CONFIG_ZMK_USB_LOGGING=y

# BLE/스플릿 관련 상세 로그 (연결 파라미터 협상, supervision timeout 등)
CONFIG_ZMK_LOG_LEVEL_DBG=y

# 끊김 사유(HCI reason code)를 보기 위한 Zephyr BT 스택 로그
CONFIG_BT_LOG_LEVEL_WRN=y
